<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Brief 상세 설문 — LNH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/application-system.css?v=20260923b">
</head>
<body>
  <header class="form-header"><a class="form-brand" href="index.html">LNH</a><span class="form-close">Brief Questionnaire</span></header>
  <main class="survey-shell">
    <section class="survey-intro">
      <p class="application-kicker">LNH BRIEF QUESTIONNAIRE</p>
      <h1>집의 기준을 세우기 위한 질문입니다.</h1>
      <p>잘 쓰는 답보다 지금의 생활을 구체적으로 적어주세요. 답변은 상담 준비를 위한 판단 자료로만 사용됩니다.</p>
      <span class="reference-code" id="survey-reference">링크 확인 중</span>
    </section>
    <form class="survey-form" id="brief-survey-form" hidden>
      <div class="survey-question"><label for="household">1. 이 공간을 함께 사용하는 사람은 누구인가요? *</label><small>가족 구성, 연령, 반려동물 등</small><textarea id="household" name="household" required></textarea></div>
      <div class="survey-question"><label for="daily-routine">2. 평일과 주말의 생활 흐름을 들려주세요. *</label><small>기상, 식사, 일, 휴식, 손님 방문처럼 반복되는 장면</small><textarea id="daily-routine" name="dailyRoutine" required></textarea></div>
      <div class="survey-question"><label for="current-discomfort">3. 지금 공간에서 가장 불편한 것은 무엇인가요? *</label><textarea id="current-discomfort" name="currentDiscomfort" required></textarea></div>
      <div class="survey-question"><label for="must-keep">4. 이번 프로젝트에서 반드시 지키고 싶은 조건은 무엇인가요? *</label><textarea id="must-keep" name="mustKeep" required></textarea></div>
      <div class="survey-question"><label for="priorities">5. 예산과 시간이 제한된다면 무엇을 먼저 선택하시겠어요? *</label><textarea id="priorities" name="priorities" required></textarea></div>
      <div class="survey-question"><label for="flexible-items">6. 반대로 조정하거나 포기할 수 있는 것은 무엇인가요?</label><textarea id="flexible-items" name="flexibleItems"></textarea></div>
      <div class="survey-question"><label for="storage-flow">7. 수납과 동선에서 필요한 변화가 있나요?</label><textarea id="storage-flow" name="storageAndFlow"></textarea></div>
      <div class="survey-question"><label for="decision-makers">8. 주요 결정을 함께 내리는 사람은 누구인가요?</label><textarea id="decision-makers" name="decisionMakers"></textarea></div>
      <div class="survey-question"><label for="reference-links">9. 참고하고 싶은 공간이나 자료가 있다면 링크를 남겨주세요.</label><textarea id="reference-links" name="referenceLinks" placeholder="여러 링크는 줄을 바꿔 입력해 주세요."></textarea></div>
      <div class="survey-question"><label for="additional-note">10. 상담 전에 LNH가 꼭 알아야 할 내용이 있나요?</label><textarea id="additional-note" name="additionalNote"></textarea></div>
      <button class="form-button" type="submit">Brief 설문 제출하기</button>
      <p class="form-message" id="survey-message" role="status" aria-live="polite"></p>
    </form>
    <section class="success-panel" id="survey-success" hidden><h2>답변이 전달되었습니다.</h2><p>작성해주신 내용을 먼저 살펴본 뒤 상담을 준비하겠습니다.</p><a class="form-button" href="index.html">LNH 홈으로</a></section>
  </main>
  <script src="assets/site-analytics.js?v=20260923b" defer></script>
  <script>
    (()=>{
      const form=document.querySelector('#brief-survey-form');
      const reference=document.querySelector('#survey-reference');
      const message=document.querySelector('#survey-message');
      const success=document.querySelector('#survey-success');
      const token=new URLSearchParams(location.search).get('token')||'';
      const initialize=async()=>{
        try{
          const response=await fetch(`/api/brief-survey?token=${encodeURIComponent(token)}`);
          const result=await response.json();
          if(!response.ok)throw new Error(result.error||'설문 링크를 확인할 수 없습니다.');
          reference.textContent=result.reference;
          form.hidden=false;
        }catch(error){reference.textContent='링크 확인 필요';message.textContent=error.message}
      };
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        if(!form.reportValidity())return;
        const button=form.querySelector('button[type="submit"]');button.disabled=true;message.textContent='답변을 전달하고 있습니다.';
        const data=Object.fromEntries(new FormData(form));data.token=token;
        try{
          const response=await fetch('/api/brief-survey',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});
          const result=await response.json();if(!response.ok)throw new Error(result.error||'답변을 전달하지 못했습니다.');
          form.hidden=true;success.hidden=false;window.LNHAnalytics?.track('form_submit',{form:'brief_survey'});
        }catch(error){message.textContent=error.message;button.disabled=false}
      });
      initialize();
    })();
  </script>
</body>
</html>
