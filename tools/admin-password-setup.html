<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LNH 관리자 비밀번호 값 생성</title>
<style>body{max-width:680px;margin:48px auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.65;color:#222}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;margin:8px 0 18px}textarea{min-height:110px}button{background:#173856;color:#fff;border:0}small{color:#666}</style>
<h1>LNH 관리자 비밀번호 값 생성</h1><p>비밀번호는 이 브라우저 안에서만 해시 처리됩니다. 생성한 두 값만 Cloudflare Secret에 넣고, 비밀번호 원문은 저장하거나 전달하지 마세요.</p>
<label>새 관리자 비밀번호 (16자 이상 권장)<input id="password" type="password" autocomplete="new-password"></label><button id="generate" type="button">Secret 값 생성</button>
<label>ADMIN_PASSWORD_SALT<textarea id="salt" readonly></textarea></label><label>ADMIN_PASSWORD_HASH<textarea id="hash" readonly></textarea></label><small>생성 후 이 페이지를 닫으면 비밀번호와 값은 브라우저에 저장되지 않습니다.</small>
<script>const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');const random=()=>hex(crypto.getRandomValues(new Uint8Array(24)));document.querySelector('#generate').onclick=async()=>{const password=document.querySelector('#password').value;if(password.length<16){alert('16자 이상 비밀번호를 사용해 주세요.');return}const salt=random(),material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:210000},material,256);document.querySelector('#salt').value=salt;document.querySelector('#hash').value=hex(bits);document.querySelector('#password').value=''}</script>
